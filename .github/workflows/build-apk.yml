name: Build Android Kiosk APK

on:
  push:
    paths:
      - 'android_kiosk/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Build Debug APK
        working-directory: android_kiosk
        run: gradle assembleDebug --stacktrace

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SIP-Kiosk-Debug-APK
          path: android_kiosk/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.0-kiosk-apk
          name: "SIP Kiosk APK (USB Camera Support)"
          body: |
            ### Biometric Attendance Kiosk APK for Android
            This APK allows using an external USB webcam connected via OTG multiport connector to your mobile phone.
            
            **Installation:**
            1. Download `app-debug.apk` directly on your Android phone.
            2. Tap to install.
            3. Plug in your USB camera via multiport adapter.
            4. Tap Settings ⚙️ and enter your server URL.
          files: android_kiosk/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
